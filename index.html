
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRIENDSHIP EMERGENCY 🚨</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

:root {
  --pink: #ff70ad;
  --hot: #ff3f91;
  --purple: #b58aff;
  --ink: #59324f;
  --paper: #fffaff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Nunito', sans-serif;
  color: var(--ink);
  background: linear-gradient(135deg, #ffe0ef, #f2e5ff, #fff0dc);
  display: grid;
  place-items: center;
  padding: 22px 12px;
  overflow-x: hidden;
}

button { font: inherit; }

#decor {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.floaty {
  position: absolute;
  bottom: -60px;
  animation: floatUp linear infinite;
  opacity: .7;
}

@keyframes floatUp {
  to { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
}

.card {
  width: min(100%, 470px);
  position: relative;
  z-index: 1;
  text-align: center;
  background: rgba(255,250,255,.94);
  border: 3px solid white;
  border-radius: 30px;
  padding: 25px 20px 20px;
  box-shadow: 0 18px 60px #aa5c9b30;
}

.stamp {
  display: inline-block;
  background: #fff0a8;
  border: 2px dashed #e3ac44;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 900;
  transform: rotate(-3deg);
  margin-bottom: 12px;
}

#emoji {
  font-size: 76px;
  line-height: 1.2;
  display: inline-block;
  cursor: pointer;
  user-select: none;
  animation: wiggle 1.7s ease-in-out infinite;
}

@keyframes wiggle {
  0%, 100% { transform: rotate(-5deg); }
  50% { transform: rotate(5deg) scale(1.04); }
}

h1 {
  font-size: clamp(28px, 7vw, 39px);
  line-height: 1.12;
  margin: 12px 0;
  font-weight: 900;
  overflow-wrap: anywhere;
}

#subtitle {
  line-height: 1.6;
  color: #906982;
  margin: 12px 0 18px;
  font-size: 15px;
}

#message {
  min-height: 28px;
  color: #e13d88;
  font-weight: 900;
  margin: 15px 0 0;
  line-height: 1.5;
}

.buttons {
  min-height: 66px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-top: 18px;
  position: relative;
}

.btn {
  border: 0;
  border-radius: 15px;
  padding: 13px 19px;
  font-size: 16px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 5px 0 #00000015;
  transition: transform .15s, filter .15s;
  touch-action: manipulation;
}

.btn:hover { filter: brightness(1.04); }
.btn:active { transform: scale(.95); }

.yes {
  background: #ff73aa;
  color: white;
}

.no {
  background: white;
  color: #c24e86;
  border: 2px solid #ffc0d9;
  position: relative;
  z-index: 5;
}

#note {
  font-size: 11px;
  color: #aa87a1;
  margin-top: 23px;
}

.progress {
  height: 9px;
  background: #f3d9e9;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 14px;
}

#bar {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, #ff72ae, #bd8aff);
  transition: width .5s;
}

#counter {
  font-size: 11px;
  color: #a17b98;
  margin-top: 6px;
}

#popups {
  position: fixed;
  inset: 0;
  z-index: 20;
  pointer-events: none;
}

.popup {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(340px, calc(100vw - 32px));
  background: white;
  border: 3px solid #ffc0de;
  border-radius: 22px;
  box-shadow: 0 15px 80px #58204d50;
  padding: 23px;
  text-align: center;
  pointer-events: auto;
  animation: appear .2s ease-out;
}

@keyframes appear {
  from { opacity: 0; scale: .8; }
  to { opacity: 1; scale: 1; }
}

.popup h2 { font-size: 22px; margin: 5px 0 12px; }
.popup p { line-height: 1.55; color: #86647c; }

.popup button {
  background: #ff80b6;
  color: white;
  border: 0;
  border-radius: 12px;
  padding: 10px 22px;
  font-weight: 900;
  cursor: pointer;
  margin-top: 8px;
}

#toast {
  position: fixed;
  z-index: 30;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(120px);
  background: #59324f;
  color: white;
  border-radius: 15px;
  padding: 13px 17px;
  width: max-content;
  max-width: calc(100vw - 30px);
  text-align: center;
  font-size: 13px;
  font-weight: 900;
  transition: transform .3s;
  pointer-events: none;
}

#toast.show { transform: translateX(-50%) translateY(0); }

.small {
  font-size: 11px;
  color: #b08ba8;
  margin-top: 18px;
}

.reset {
  background: #bd8aff;
  color: white;
  margin-top: 16px;
}

.confetti {
  position: fixed;
  z-index: 25;
  pointer-events: none;
  top: -30px;
  animation: fall 3s linear forwards;
}

@keyframes fall {
  to { transform: translateY(110vh) rotate(800deg); opacity: 0; }
}

.shake { animation: shake .35s; }

@keyframes shake {
  20% { transform: translateX(-8px) rotate(-1deg); }
  40% { transform: translateX(8px) rotate(1deg); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}

#court {
  background: #fff1d9;
  border: 3px dashed #d7a26b;
  border-radius: 16px;
  padding: 12px;
  margin: 15px 0;
  font-size: 13px;
  line-height: 1.8;
}

#court strong { color: #ad4c54; }

@media (max-width: 380px) {
  .card { padding: 20px 14px; }
  .btn { padding: 12px 14px; font-size: 14px; }
  .buttons { gap: 10px; }
}
</style>
</head>

<body>

<div id="decor"></div>
<div id="popups"></div>
<div id="toast"></div>

<main class="card" id="card">
  <div class="stamp" id="stamp">100% SERIOUS WEBSITE</div>

  <div id="emoji" title="Psst... click me!">🥺</div>

  <h1 id="title">r u mad at me?</h1>
  <p id="subtitle">
    asking for a friend.<br>
    unfortunately the friend is me.
  </p>

  <div id="court" hidden></div>

  <div class="buttons" id="buttons">
    <button class="btn yes" id="yes">YES 😡</button>
    <button class="btn no" id="no">NO 🥹</button>
  </div>

  <p id="message" aria-live="polite"></p>

  <div class="progress">
    <div id="bar"></div>
  </div>
  <div id="counter">friendship restoration progress: 0%</div>

  <div id="note">♡ please answer with ur remaining brain cells ♡</div>
  <div class="small">EST. 2 MINUTES AGO · REGRETS: MANY</div>
</main>

<script>
const $ = id => document.getElementById(id);

let stage = 0;
let escapes = 0;
let catClicks = 0;
let popupCount = 0;
let noLocked = false;
let popupTimer = null;

const questions = [
  {
    emoji: "🥺",
    stamp: "FRIENDSHIP EMERGENCY",
    title: "r u mad at me?",
    subtitle: "or did ur phone get swallowed by a whale",
    yes: "YES 😡",
    no: "NO 🥹",
    note: "♡ pls don't send this to the supreme court ♡"
  },
  {
    emoji: "😭",
    stamp: "APOLOGY DEPARTMENT",
    title: "is it too late to say sorry?",
    subtitle: "i bring one expired biscuit and questionable intentions",
    yes: "YES. TOO LATE. 💀",
    no: "NO 🥺",
    note: "♡ my lawyer advised me to ask ♡"
  },
  {
    emoji: "🧎",
    stamp: "OFFICIAL NEGOTIATIONS",
    title: "will u forgive my clownery?",
    subtitle: "i can offer u 3 memes and a half-eaten imaginary cookie",
    yes: "FINE 🙄",
    no: "ABSOLUTELY NOT",
    note: "♡ the council is watching ♡"
  }
];

const escapeLines = [
  "TOO SLOW, BESTIE 💨",
  "THE NO BUTTON HAS COMMITMENT ISSUES.",
  "IT HAS LEFT THE GROUP CHAT.",
  "THE BUTTON IS CURRENTLY IN MUMBAI.",
  "BRO IT HAS FILED A RESTRAINING ORDER.",
  "THE BUTTON HAS CHANGED ITS NAME AND MOVED ABROAD.",
  "EVEN THE BUTTON NEEDS PERSONAL SPACE 💀",
  "NO BUTTON STATUS: MISSING. LAST SEEN RUNNING.",
  "THE BUTTON HAS HIRED A LAWYER.",
  "PLEASE STOP HARASSING THE HTML ELEMENT 😭"
];

function setMessage(text) {
  $("message").textContent = text;
}

function progress(value) {
  $("bar").style.width = value + "%";
  $("counter").textContent =
    "friendship restoration progress: " + value + "%";
}

function renderQuestion() {
  const q = questions[stage];

  $("emoji").textContent = q.emoji;
  $("stamp").textContent = q.stamp;
  $("title").textContent = q.title;
  $("subtitle").textContent = q.subtitle;
  $("yes").textContent = q.yes;
  $("no").textContent = q.no;
  $("note").textContent = q.note;

  $("court").hidden = true;
  $("buttons").style.display = "flex";
  $("yes").style.display = "inline-block";
  $("no").style.display = "inline-block";
  $("no").style.position = "relative";
  $("no").style.left = "0";
  $("no").style.top = "0";
  $("no").style.transform = "";
  $("no").style.visibility = "visible";

  noLocked = false;
  escapes = 0;
  setMessage("");
  progress(stage * 25);
}

function toast(text) {
  $("toast").textContent = text;
  $("toast").classList.add("show");

  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => {
    $("toast").classList.remove("show");
  }, 2300);
}

function popup(title, text, button = "OK I GUESS") {
  const container = $("popups");
  const box = document.createElement("div");
  box.className = "popup";

  const heading = document.createElement("h2");
  heading.textContent = title;

  const paragraph = document.createElement("p");
  paragraph.textContent = text;

  const close = document.createElement("button");
  close.textContent = button;
  close.onclick = () => box.remove();

  box.append(heading, paragraph, close);
  container.appendChild(box);

  popupCount++;

  if (container.children.length > 1) {
    // Keep the screen usable if surprise popups overlap.
    while (container.children.length > 2) {
      container.firstElementChild.remove();
    }
  }

  return box;
}

function runAway() {
  if (noLocked || stage > 2) return;

  escapes++;

  const no = $("no");
  const rect = no.getBoundingClientRect();

  // Move the button to the viewport after a few escapes.
  no.style.position = "fixed";

  const maxX = Math.max(8, window.innerWidth - rect.width - 8);
  const maxY = Math.max(8, window.innerHeight - rect.height - 8);

  no.style.left = Math.round(8 + Math.random() * (maxX - 8)) + "px";
  no.style.top = Math.round(8 + Math.random() * (maxY - 8)) + "px";

  setMessage(escapeLines[Math.min(escapes - 1, escapeLines.length - 1)]);

  if (escapes === 3) {
    toast("🚨 THE NO BUTTON IS ESCAPING CUSTODY 🚨");
  }

  if (escapes === 5) {
    popup("BREAKING NEWS", "Local button refuses to cooperate with its creator.");
  }

  if (escapes === 8) {
    toast("THE BUTTON IS NOW ON A WELL-DESERVED VACATION.");
  }

  if (escapes === 10) {
    popup(
      "FRIENDSHIP COURT NOTICE",
      "The NO button has been summoned for questioning. It declined to comment."
    );
  }
}

// Mouse and touch support.
// $("no").addEventListener("pointerenter", e => {
//   if (e.pointerType === "mouse") runAway();
// });

// $("no").addEventListener("pointerdown", e => {
//   if (e.pointerType === "touch") {
//     e.preventDefault();
//     runAway();
//   }
// });

// $("no").addEventListener("click", e => {
//   e.preventDefault();
//   runAway();
// });
// Works with laptop mouse, trackpad, and mobile touchscreens.
const noButton = $("no");

noButton.addEventListener("pointerenter", (e) => {
  if (e.pointerType === "mouse") {
    runAway();
  }
});

noButton.addEventListener("pointerdown", (e) => {
  if (e.pointerType === "touch") {
    e.preventDefault();
    runAway();
  }
});

noButton.addEventListener("click", (e) => {
  e.preventDefault();
  runAway();
});

// Occasionally surprise the friend with nonsense.
function scheduleRandomPopup() {
  clearTimeout(popupTimer);

  popupTimer = setTimeout(() => {
    if (stage < 3 && !$("popups").children.length) {
      const surprises = [
        ["IMPORTANT ANNOUNCEMENT 📢", "Your free trial of being my friend has been renewed indefinitely."],
        ["SYSTEM ERROR 💀", "Friendship.exe has stopped working. Try offering snacks."],
        ["URGENT QUESTION", "If we were worms, would we still be friends?"],
        ["DAILY REMINDER", "You are legally required to send me a meme."],
        ["NEW ACHIEVEMENT 🏆", "You have unlocked: Professional Overthinker."],
        ["BREAKING NEWS", "Two idiots remain friends despite questionable decision-making."]
      ];

      const s = surprises[Math.floor(Math.random() * surprises.length)];
      popup(s[0], s[1], "understood 🫡");
    }

    if (stage < 3) scheduleRandomPopup();
  }, 12000 + Math.random() * 10000);
}

scheduleRandomPopup();

function shakeCard() {
  $("card").classList.remove("shake");
  void $("card").offsetWidth;
  $("card").classList.add("shake");
}

function showCourt() {
  $("emoji").textContent = "⚖️";
  $("stamp").textContent = "COURT IS NOW IN SESSION";
  $("title").textContent = "OBJECTION, YOUR HONOUR!";
  $("subtitle").textContent =
    "The accused is charged with being suspiciously quiet.";

  $("court").hidden = false;
  $("court").innerHTML = `
    <strong>CASE NO. 404: FRIENDSHIP.EXE</strong><br>
    Judge: a very disappointed capybara 🦫<br>
    Prosecutor: me, obviously 💅<br>
    Defendant: u. unfortunately.<br>
    Evidence A: suspicious vibes<br>
    Evidence B: questionable texting habits<br>
    Evidence C: u are still my friend 😔<br><br>
    <strong>VERDICT: GUILTY OF BEING SILLY.</strong>
  `;

  $("yes").textContent = "I ACCEPT MY FATE 😔";
  $("no").textContent = "APPEAL THE VERDICT";
  $("note").textContent = "♡ legal fees payable in memes ♡";
  progress(50);
}

function advance() {
  if (stage < 2) {
    stage++;
    renderQuestion();

    if (stage === 1) {
      toast("📢 YOUR APOLOGY HAS BEEN RECEIVED BY HR.");
    }

    if (stage === 2) {
      showCourt();
    }

    return;
  }

  finish();
}

function handleYes() {
  if (stage === 0) {
    noLocked = true;
    $("yes").disabled = true;
    $("no").style.display = "none";
    $("buttons").style.display = "flex";
    $("yes").textContent = "PROCESSING TRAUMA...";
    $("emoji").textContent = "💔";
    $("stamp").textContent = "EMOTIONAL DAMAGE DETECTED";
    $("title").textContent = "HELLO????";
    $("subtitle").textContent =
      "I WAS NOT INFORMED THAT THIS WAS AN OPTION.";

    setMessage("initiating emergency apology protocol...");

    progress(15);
    shakeCard();

    setTimeout(() => {
      popup(
        "EMERGENCY MEETING 🚨",
        "The friendship council would like to know WHY we are like this."
      );
    }, 600);

    setTimeout(() => {
      $("yes").disabled = false;
      stage = 1;
      renderQuestion();
    }, 3200);

  } else if (stage === 1) {
    noLocked = true;
    $("no").style.display = "none";
    $("yes").textContent = "WAITING FOR LAWYER...";
    $("emoji").textContent = "🧑‍⚖️";
    $("stamp").textContent = "LEGAL DEPARTMENT";
    $("title").textContent = "YOUR HONOUR, PLEASE.";
    $("subtitle").textContent =
      "My client is stupid, but they are trying their best.";

    setMessage("printing 47-page apology...");

    progress(35);
    shakeCard();

    setTimeout(() => {
      popup(
        "YOUR APOLOGY IS READY 📄",
        "Page 1: I overthink. Page 2: I panic. Pages 3–47: please don't be mad."
      );
    }, 600);

    setTimeout(() => {
      stage = 2;
      renderQuestion();
      showCourt();
    }, 3000);

  } else if (stage === 2) {
    popup(
      "THE JUDGE HAS SPOKEN ⚖️",
      "Your appeal has been rejected because the judge wants lunch.",
      "continue anyway"
    );

    setTimeout(finish, 1600);
  }
}

function finish() {
  stage = 3;
  noLocked = true;
  clearTimeout(popupTimer);

  $("emoji").textContent = "😎";
  $("stamp").textContent = "CASE CLOSED · FRIENDSHIP RESTORED";
  $("title").textContent = "CONGRATULATIONS.";
  $("subtitle").textContent =
    "U HAVE BEEN FORGIVEN. THIS DOES NOT MEAN I WILL STOP ANNOYING U.";

  $("court").hidden = false;
  $("court").innerHTML = `
    <strong>OFFICIAL FRIENDSHIP CONTRACT 🤝</strong><br>
    ✔ unlimited nonsense<br>
    ✔ unsolicited memes<br>
    ✔ random 3 AM thoughts<br>
    ✔ bullying each other (affectionately)<br>
    ✔ being there when it matters<br><br>
    <strong>TERMS & CONDITIONS</strong><br>
    You will be roasted.<br>
    You will be spammed.<br>
    You will be loved. Unfortunately.
  `;

  $("buttons").style.display = "none";
  $("note").textContent = "♡ friendship status: chronically online ♡";
  setMessage("friendship restoration successful (probably)");
  progress(100);

  confetti();

  const replay = document.createElement("button");
  replay.className = "btn reset";
  replay.textContent = "REPLAY THE NONSENSE ↻";

  replay.onclick = () => {
    stage = 0;
    escapes = 0;
    catClicks = 0;
    replay.remove();
    $("yes").disabled = false;
    $("yes").style.display = "inline-block";
    $("yes").textContent = "YES 😡";
    $("court").hidden = true;
    renderQuestion();
    scheduleRandomPopup();
  };

  $("buttons").after(replay);

  setTimeout(() => {
    popup(
      "ONE LAST THING 🥹",
      "Thanks for being my chaotic friend. Now go drink water, u dehydrated potato.",
      "ILY (PLATONICALLY) 💖"
    );
  }, 1100);
}

$("yes").addEventListener("click", handleYes);

// Click the emoji repeatedly to discover a secret.
$("emoji").addEventListener("click", () => {
  catClicks++;

  const secrets = [
    "psst... the developer is also a clown 🤡",
    "SECRET UNLOCKED: certified yapper 🎤",
    "your friendship warranty has been extended by 1 meme",
    "did u know? u are mildly annoying. respectfully.",
    "ACHIEVEMENT: clicked an emoji for no reason 🏆"
  ];

  toast(secrets[Math.min(catClicks - 1, secrets.length - 1)]);

  if (catClicks === 5) {
    popup(
      "SECRET LEVEL UNLOCKED 🔓",
      "You found the secret ending! Your reward is a virtual high-five and absolutely no money."
    );
    confetti();
    catClicks = 0;
  }
});

function confetti() {
  const symbols = ["💖", "✨", "🎉", "💕", "🦖", "🍕", "🤡", "🧦"];

  for (let i = 0; i < 65; i++) {
    const piece = document.createElement("span");
    piece.className = "confetti";
    piece.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    piece.style.left = Math.random() * 100 + "vw";
    piece.style.fontSize = 14 + Math.random() * 24 + "px";
    piece.style.animationDuration = 2 + Math.random() * 3 + "s";
    piece.style.animationDelay = Math.random() * .8 + "s";

    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 6000);
  }
}

// Floating background doodles.
const decor = $("decor");
const doodles = ["♡", "💕", "✨", "🎀", "🍓", "🦖", "🤡"];

for (let i = 0; i < 22; i++) {
  const el = document.createElement("span");
  el.className = "floaty";
  el.textContent = doodles[i % doodles.length];
  el.style.left = Math.random() * 100 + "%";
  el.style.fontSize = 16 + Math.random() * 22 + "px";
  el.style.animationDuration = 7 + Math.random() * 10 + "s";
  el.style.animationDelay = Math.random() * 10 + "s";
  decor.appendChild(el);
}

// An occasional tiny announcement. Doesn't interrupt typing or button clicks.
setInterval(() => {
  if (stage < 3 && Math.random() < 0.22) {
    const lines = [
      "📢 FRIENDSHIP DEPARTMENT IS UNDERSTAFFED.",
      "⚠️ ONE BRAIN CELL DETECTED BETWEEN BOTH FRIENDS.",
      "BREAKING: absolutely nothing has changed.",
      "REMINDER: touch grass after this.",
      "THE COUNCIL DEMANDS A MEME."
    ];
    toast(lines[Math.floor(Math.random() * lines.length)]);
  }
}, 9000);

renderQuestion();
</script>

</body>
</html>
